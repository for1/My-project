name: Build Android APK

# 在云端编译出可直接安装的 APK —— 本地不需要装 JDK / Android SDK / Gradle / Android Studio。
#
# 用法（用浏览器即可，不需要 git）：
#   1. GitHub 新建仓库（默认分支 main），把本项目内容上传
#   2. 仓库页 → Actions → 左侧「Build Android APK」→ Run workflow
#   3. 等 3~5 分钟 → 该次运行页面底部 Artifacts → 下载 scan2plan-capture-debug-apk.zip
#   4. 解压得到 app-debug.apk，装到手机即可

on:
  push:
    paths:
      - 'android/**'
      - '.github/workflows/build-apk.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install SDK packages
        run: |
          sdkmanager --install "platform-tools" "platforms;android-34" "build-tools;34.0.0"

      - name: Setup Gradle 8.7
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.7'

      - name: Show toolchain versions
        run: |
          java -version
          gradle --version
          ls "$ANDROID_HOME/platforms" || true

      - name: Pin latest ARCore version available on the Maven repo
        working-directory: android
        run: |
          set -e
          # ARCore 发布在 Google Maven（gradle 里第一个仓库就是 google()）。
          # 实时取一次最新版本号，避免工程里写死的版本号不存在导致依赖解析失败。
          META_GOOGLE="https://dl.google.com/dl/android/maven2/com/google/ar/core/maven-metadata.xml"
          META_CENTRAL="https://repo1.maven.org/maven2/com/google/ar/core/maven-metadata.xml"
          get_ver() {
            curl -fsSL --max-time 20 "$1" 2>/dev/null \
              | grep -oE '<(latest|release)>[^<]+' | head -1 | sed -E 's/.*>//' || true
          }
          LATEST="$(get_ver "$META_GOOGLE")"
          if [ -z "$LATEST" ]; then LATEST="$(get_ver "$META_CENTRAL")"; fi
          if [ -n "$LATEST" ]; then
            echo "ARCore 最新可用版本 = $LATEST"
            sed -i "s|com.google.ar:core:[0-9][0-9.]*|com.google.ar:core:$LATEST|" app/build.gradle.kts
          else
            echo "拉取版本元数据失败，沿用工程里写死的版本"
          fi
          grep -n "com.google.ar:core" app/build.gradle.kts

      - name: Build debug APK
        working-directory: android
        run: gradle :app:assembleDebug --no-daemon --stacktrace

      - name: Show APK info
        working-directory: android
        run: |
          ls -lh app/build/outputs/apk/debug/
          APK=$(ls app/build/outputs/apk/debug/*.apk | head -1)
          echo "APK=$APK"
          "$ANDROID_HOME/build-tools/34.0.0/aapt2" dump badging "$APK" | head -8

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: scan2plan-capture-debug-apk
          path: android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 90
